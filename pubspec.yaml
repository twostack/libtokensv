name: libtokensv
description: >-
  BSV token scripts for libspiffy wallets: PushDrop, the token format BRC-100
  overlays use, and the TSL1 lineage tokens (TSL1_LT_FT, TSL1_LT_NFT and the
  fuelled family TSL1_LT_FNFT, with its Voucher and Note kinds) and their
  libspiffy plugins. Also a client for BSV overlay services (SLAP and SHIP
  lookup, submit).
version: 0.2.0
repository: https://github.com/twostack/libtokensv

environment:
  sdk: ^3.8.1

dependencies:
  collection: ^1.18.0
  convert: ^3.1.1
  crypto: ^3.0.6
  cryptography: ^2.5.0
  dartsv: ^3.1.1
  http: ^1.2.0
  libspiffy: ^5.4.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  # The plugin tests run the plugins inside a real libspiffy wallet.
  dactor: ^1.3.0
  isar_community: ^3.3.2
  spiffynode: ^1.1.0

dependency_overrides:
  # isar_community 3.4 asserts on the 3.3.2 schemas libspiffy's dependencies
  # were generated with. Only for this package's own tests: overrides do not
  # reach the apps that use it.
  isar_community: 3.3.2
